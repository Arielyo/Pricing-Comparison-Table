<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:title" content="Acme Plans Comparison Table" />
    <title>Acme Plans Comparison Table</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/png" href="Favicon.png">
</head>

<body>
    <header>
        <div>Acme Plans</div>
        <nav>
            <a>Home</a>
            <a>About</a>
            <a>Contact</a>
        </nav>
    </header>
    <main>
        <table>
            <caption>Plan comparison</caption>
            <thead>
                <tr>
                    <th scope="col">Plan</th>
                    <th scope="col">Storage</th>
                    <th scope="col">Projects</th>
                    <th scope="col">Support</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">Free</th>
                    <td>5 GB</td>
                    <td>3</td>
                    <td>Email</td>
                </tr>
                <tr>
                    <th scope="row">Pro</td>
                    <td>100 GB</td>
                    <td>25</td>
                    <td>Priority Email</td>
                </tr>
                <tr>
                    <th scope="row">Business</td>
                    <td>1 TB</td>
                    <td>Unlimited</td>
                    <td>24/7 Phone</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="4">All plans include SSL and daily backups</td>
                </tr>
            </tfoot>
        </table>
        <footer>
            <div>

            </div>
        </footer>
    </main>
</body>

</html>
